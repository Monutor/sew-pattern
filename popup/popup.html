<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEW Templates</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --md-sys-color-primary: #0061a4;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #d3e5ff;
            --md-sys-color-on-primary-container: #001d35;
            --md-sys-color-secondary-container: #d6e4f2;
            --md-sys-color-on-secondary-container: #0e1d2a;
            --md-sys-color-surface: #fafafa;
            --md-sys-color-on-surface: #212121;
            --md-sys-color-surface-variant: #e1e2ec;
            --md-sys-color-on-surface-variant: #44474f;
            --md-sys-color-outline: #74777f;
            --md-sys-color-primary-dark: #00479b;
            --md-sys-color-hover: rgba(0, 0, 0, 0.08);
            --md-sys-shape-corner-small: 8px;
            --md-sys-shape-corner-medium: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            width: 20rem;
            min-height: 400px;
            overflow-x: hidden;
        }

        /* ── Top bar ─────────────────────────────── */
        .top-bar {
            display: flex;
            align-items: center;
            height: 3.25rem;
            padding: 0 1rem;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .top-bar-title {
            flex: 1;
            font-size: 0.9375rem;
            font-weight: 500;
            letter-spacing: 0.1px;
        }

        /* ── Icon buttons ────────────────────────── */
        .icon-btn-round {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--md-sys-color-on-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .icon-btn-round:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .icon-btn-round svg {
            width: 1.25rem;
            height: 1.25rem;
            fill: currentColor;
        }

        /* ── List ────────────────────────────────── */
        .template-card-list {
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            max-height: calc(25rem - 3.25rem);
            overflow-y: auto;
        }

        /* ── Card ────────────────────────────────── */
        .template-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem 0.75rem;
            border-radius: var(--md-sys-shape-corner-small);
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s;
        }

        .template-card:hover {
            background: var(--md-sys-color-hover);
        }

        .template-card:active {
            background: rgba(0, 0, 0, 0.12);
        }

        .card-icon-wrap {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            background: var(--md-sys-color-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-icon-wrap svg {
            width: 1.25rem;
            height: 1.25rem;
            fill: var(--md-sys-color-on-primary-container);
        }

        .card-text {
            flex: 1;
            min-width: 0;
        }

        .card-name {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 0.75rem;
            color: var(--md-sys-color-on-surface-variant);
            margin-top: 2px;
        }

        /* ── Empty state ─────────────────────────── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            color: var(--md-sys-color-on-surface-variant);
        }

        .empty-state-icon {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            background: var(--md-sys-color-secondary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
        }

        .empty-state-icon svg {
            width: 1.75rem;
            height: 1.75rem;
            fill: var(--md-sys-color-on-secondary-container);
        }

        .empty-state p {
            font-size: 0.8125rem;
            line-height: 1.6;
            text-align: center;
            color: var(--md-sys-color-on-surface-variant);
        }

        /* ── Error state ─────────────────────────── */
        .error-state {
            padding: 1.5rem 1rem;
            font-size: 0.8125rem;
            color: #d32f2f;
            text-align: center;
        }

        /* ── Scrollbar ───────────────────────────── */
        .template-card-list::-webkit-scrollbar {
            width: 0.25rem;
        }

        .template-card-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .template-card-list::-webkit-scrollbar-thumb {
            background: var(--md-sys-color-outline);
            border-radius: 2px;
        }

        /* ── Links ───────────────────────────────── */
        a { text-decoration: none; color: inherit; }

        /* ── prefers-reduced-motion ─────────────── */
        @media (prefers-reduced-motion: reduce) {
            .template-card,
            .icon-btn-round,
            .empty-state-icon {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }

            .template-card:hover { transform: none; }
        }
    </style>
</head>
<body>
    <!-- Top bar -->
    <div class="top-bar">
        <span class="top-bar-title">Шаблоны</span>
        <button class="icon-btn-round" id="openOptions" title="Настройки" aria-label="Открыть настройки">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg>
        </button>
    </div>

    <!-- Template card list -->
    <div id="templateList" class="template-card-list"></div>

    <script src="popup.js" defer></script>
</body>
</html>
